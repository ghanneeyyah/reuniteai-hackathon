services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ai_models:/root/.deepface

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ai_models: